<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EstateFlow Real Estate CRM</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
  <!-- Custom Light Theme -->
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    body {
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 460px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid var(--crm-border);
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <!-- Dynamic Brand Header -->
      <div class="text-center mb-4">
        <div class="sidebar-brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
          <i class="fas fa-city"></i>
        </div>
        <h2 class="fw-bold text-dark mb-1" data-cms="login_brand_title">Real Estate CRM</h2>
        <p class="text-secondary small" data-cms="login_brand_subtitle">Real Estate Sales & Booking Platform</p>
      </div>

      <div class="mb-4 text-center">
        <h4 class="fw-bold text-dark mb-1" data-cms="login_heading">Sign In to Your Account</h4>
        <p class="text-secondary small mb-0" data-cms="login_subheading">Enter your verified credentials to access your real estate workspace</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="email" class="form-label" data-cms="login_label_identifier">Email or Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="email" name="email" required autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" required>
            <button class="password-eye-btn" type="button" onclick="CRM.togglePassword('password', this)" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" id="loginSubmitBtn">
          <span id="btnText">Sign In to Dashboard</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>

        <div class="text-center">
          <span class="text-secondary small">Don't have an account?</span>
          <a href="/register" class="small fw-semibold text-primary text-decoration-none ms-1">Register here</a>
        </div>
      </form>
    </div>

    <div class="text-center mt-3 text-secondary small" data-cms="login_footer_text">
      &copy; 2026 Real Estate CRM. Protected by Kosal IT Solutions.
    </div>
  </div>

  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
  <!-- CRM Core App JS (loads dynamic CMS content) -->
  <script src="/static/js/crm-app.js"></script>
  <!-- Dedicated External Auth JS -->
  <script src="/static/js/auth.js"></script>
</body>
</html>
